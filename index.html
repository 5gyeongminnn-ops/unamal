<title>SQUISHY</title>

<style>
:root{--bg:#F1F0EA;--ink:#111;--title:#111;--sub:#6b6a62;--line:rgba(17,17,17,.15);--paper:#fff;--lime:#CDF55A;--violet:#8B7CF3;--shadow:rgba(17,17,17,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121310;--ink:#F4F3EA;--title:#2C2D26;--sub:#9a9a8c;--line:rgba(244,243,234,.2);--paper:#26271F;--shadow:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#121310;--ink:#F4F3EA;--title:#2C2D26;--sub:#9a9a8c;--line:rgba(244,243,234,.2);--paper:#26271F;--shadow:rgba(0,0,0,.55)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 55% at 50% 0%,rgba(205,245,90,.38),transparent 62%),var(--bg);color:var(--ink);
font-family:"Space Mono","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",monospace;display:flex;flex-direction:column;align-items:center;overflow:hidden;
touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
header{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;font-size:.72rem;letter-spacing:.08em;font-weight:700}
.reg{width:26px;height:26px;fill:none;stroke:var(--ink);stroke-width:1.4}
.bar{width:46px;height:18px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px)}
#stage{position:relative;flex:1;min-height:0;width:100%;isolation:isolate;overflow:hidden}
#title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Black Han Sans","Apple SD Gothic Neo",sans-serif;font-size:min(31vw,340px);line-height:1;letter-spacing:-.02em;color:var(--title);white-space:nowrap;pointer-events:none;transform:translateY(-3%)}
#floor{position:absolute;left:50%;border-radius:50%;background:var(--shadow);filter:blur(9px);transform:translate(-50%,-50%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#stk{position:absolute;top:5%;right:5%;width:84px;height:84px;pointer-events:none;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#stk{animation:none}}
#meter{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column-reverse;gap:4px;pointer-events:none}
#meter i{display:block;width:18px;height:6px;border-radius:2px;background:var(--line)}
#meterlbl{position:absolute;left:10px;top:calc(50% + 78px);font-size:.62rem;letter-spacing:.1em;font-weight:700;writing-mode:vertical-rl;color:var(--sub);pointer-events:none}
#hint{position:absolute;bottom:2%;width:100%;text-align:center;color:var(--sub);font-size:.78rem;letter-spacing:.06em;transition:opacity .4s;pointer-events:none}
#bottom{padding:0 10px 16px}
#syr{display:flex;gap:10px;justify-content:center}
.sy{background:none;border:0;padding:4px;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;touch-action:none}
.sy svg{width:min(42vw,172px);height:auto;display:block}
#sy1 svg{transform:scaleX(-1)}
.stk{border:3px solid #fff;border-radius:999px;padding:3px 13px;font:400 .95rem "Black Han Sans","Apple SD Gothic Neo",sans-serif;letter-spacing:.02em;box-shadow:0 2px 0 var(--shadow),0 8px 16px var(--shadow);transform:rotate(var(--r))}
.bit{position:fixed;z-index:9;border-radius:50%;pointer-events:none}
</style>
</head>
